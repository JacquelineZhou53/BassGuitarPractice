<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Notation</title>
    <script src="vexflow-min.js"></script>
    <script src="opensheetmusicdisplay.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #osmd-container {
            min-height: 200px;
            padding: 10px;
        }

        #osmd-container svg {
            display: block;
            height: auto;
            max-width: none;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #666;
            font-size: 14px;
        }

        .error {
            color: #d32f2f;
            padding: 20px;
            font-size: 14px;
        }

        .note-highlight {
            fill: #2196F3 !important;
            stroke: #1976D2 !important;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1c1c1e;
            }

            #osmd-container svg {
                filter: invert(1) hue-rotate(180deg);
            }

            .loading, .error {
                color: #ccc;
            }
        }
    </style>
</head>
<body>
    <div id="osmd-container">
        <div class="loading">Loading notation...</div>
    </div>

    <script>
        var osmd = null;
        var currentMusicXML = null;

        function sendDebug(msg) {
            notifySwift("debug", { message: msg });
        }

        sendDebug("Script started");
        sendDebug("opensheetmusicdisplay defined: " + (typeof opensheetmusicdisplay !== "undefined"));
        sendDebug("VexFlow defined: " + (typeof Vex !== "undefined"));

        function initOSMD() {
            try {
                sendDebug("Initializing OSMD...");

                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
                    backend: "svg",
                    drawTitle: false,
                    drawSubtitle: false,
                    drawComposer: false,
                    drawLyricist: false,
                    drawCredits: false,
                    autoResize: false,
                    followCursor: false
                });

                // 设置紧凑的音符间距
                var rules = osmd.EngravingRules;
                rules.MinNoteDistance = 0.5;
                rules.StaffNoteDistance = 0.8;

                sendDebug("OSMD initialized");
                notifySwift("initialized", {});
            } catch (error) {
                sendDebug("Failed to initialize OSMD: " + error.message);
                showError("Failed to initialize notation renderer: " + error.message);
                notifySwift("error", { message: error.message });
            }
        }

        function loadAndRender(musicXML) {
            if (!osmd) {
                console.error("OSMD not initialized");
                showError("Notation renderer not ready");
                return;
            }

            currentMusicXML = musicXML;

            var container = document.getElementById("osmd-container");
            container.innerHTML = "";

            osmd.load(musicXML).then(function() {
                osmd.render();

                var svg = container.querySelector("svg");
                if (svg) {
                    var bbox = svg.getBBox();
                    var svgWidth = bbox.width + bbox.x;
                    document.body.style.width = svgWidth + "px";
                    sendDebug("SVG bbox width=" + svgWidth + ", body width=" + document.body.style.width);
                }

                console.log("Notation rendered successfully");
                notifySwift("rendered", {
                    width: svgWidth,
                    height: container.scrollHeight
                });
            }).catch(function(error) {
                console.error("Failed to render notation:", error);
                sendDebug("Render error: " + (error && error.stack ? error.stack : String(error)));
                showError("Failed to render notation: " + error.message);
                notifySwift("error", { message: error.message, stack: error && error.stack ? error.stack : "" });
            });
        }

        function highlightNote(measureNumber, noteIndex) {
            if (!osmd) return;

            var container = document.getElementById("osmd-container");
            var notes = container.querySelectorAll(".note-group, .vf-notehead");

            notes.forEach(function(note, index) {
                note.classList.remove("note-highlight");
            });

            if (noteIndex >= 0 && noteIndex < notes.length) {
                notes[noteIndex].classList.add("note-highlight");
            }
        }

        function clearHighlights() {
            var container = document.getElementById("osmd-container");
            var notes = container.querySelectorAll(".note-highlight");
            notes.forEach(function(note) {
                note.classList.remove("note-highlight");
            });
        }

        function showError(message) {
            var container = document.getElementById("osmd-container");
            container.innerHTML = '<div class="error">' + message + '</div>';
        }

        function notifySwift(type, data) {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.notationBridge) {
                window.webkit.messageHandlers.notationBridge.postMessage({
                    type: type,
                    data: data
                });
            }
        }

        document.addEventListener("click", function(event) {
            var target = event.target;
            while (target && target !== document.body) {
                if (target.classList && (target.classList.contains("note-group") || target.classList.contains("vf-notehead"))) {
                    var noteData = {
                        element: target.outerHTML.substring(0, 100)
                    };
                    notifySwift("noteClicked", noteData);
                    break;
                }
                target = target.parentNode;
            }
        });

        if (typeof opensheetmusicdisplay !== "undefined") {
            initOSMD();
        } else {
            window.addEventListener("load", function() {
                setTimeout(initOSMD, 100);
            });
        }
    </script>
</body>
</html>
