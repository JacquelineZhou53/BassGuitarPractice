name: BassPractice
options:
  bundleIdPrefix: com.basspractice
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    INFOPLIST_KEY_CFBundleDisplayName: "贝斯练习"

targets:
  BassPractice:
    type: application
    platform: iOS
    sources:
      - BassPractice
    settings:
      base:
        INFOPLIST_FILE: BassPractice/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.basspractice.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  BassPracticeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BassPracticeTests
    dependencies:
      - target: BassPractice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basspractice.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BassPractice.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BassPractice"
        BUNDLE_LOADER: "$(TEST_HOST)"
